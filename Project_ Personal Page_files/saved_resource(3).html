    (function() {
        /**
         * Neutralizes AudioContext constructors on a given window.
         * @param {Window} win The target window.
         */
        var neutralizeAudio = function(win, iframe = false) {
            try {
                if (!win) return;

                var noOp = function() { 
                    console.log("AudioContext creation attempt blocked."+(iframe ? ' inside iframe':''));
                    return null; 
                };

                // Override standard and prefixed APIs (webkit for Safari)
                win.AudioContext = noOp;
                win.webkitAudioContext = noOp;
                win.OfflineAudioContext = noOp;
                win.webkitOfflineAudioContext = noOp;
                
                // Optional: Also block the __pm_glbl global script if necessary
                Object.defineProperty(win, '__pm_glbl', {
                    set: function(val) { console.log("__pm_glbl write attempt blocked"+(iframe ? ' inside iframe':'')); },
                    get: function() { return {}; },
                    configurable: true // Important to be able to redefine it
                });
            } catch (e) {
                // Silent for cross-origin iframes where access is denied
            }
        };

        /**
         * Processes an iframe element, waiting for it to load if necessary.
         * @param {HTMLIFrameElement} iframe The iframe to process.
         */
        var processIframe = function(iframe) {
            // The iframe may already be loaded, especially if it's empty (about:blank)
            neutralizeAudio(iframe.contentWindow, true);
            // Add a load listener to be sure to run it after the content has loaded
            iframe.addEventListener('load', function() {
                neutralizeAudio(iframe.contentWindow, true);
            });
        };

        // Neutralize the main window immediately
        neutralizeAudio(window);

        var setupObservers = function() {
            // Process iframes already present in the document
            var existingIframes = document.getElementsByTagName('iframe');
            for (var i = 0; i < existingIframes.length; i++) {
                processIframe(existingIframes[i]);
            }

            // Observe the document to detect the addition of new iframes
            if ('MutationObserver' in window) {
                var observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        mutation.addedNodes.forEach(function(node) {
                            // If the added node is an iframe
                            if (node.tagName === 'IFRAME') {
                                processIframe(node);
                            }
                            // If the node contains iframes
                            else if (node.nodeType === 1 && node.querySelectorAll) {
                                var childIframes = node.querySelectorAll('iframe');
                                for (var j = 0; j < childIframes.length; j++) {
                                    processIframe(childIframes[j]);
                                }
                            }
                        });
                    });
                });

                // Start observing the body
                if (document.body) {
                    observer.observe(document.body, {
                        childList: true,
                        subtree: true
                    });
                }
            }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupObservers);
        } else {
          setupObservers();
        }
    })();
